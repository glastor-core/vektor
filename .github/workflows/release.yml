name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify-release:
    name: Verify Tag & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-verify

      - name: Resolve version and validate tag
        id: meta
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vektor-cli") | .version')"
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="v${CARGO_VERSION}"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${EXPECTED}" >&2
              exit 1
            fi
          fi

      - name: Run Vektor security audit gate
        run: cargo run --locked --bin vektor -- audit --format json --fail-on high

  build:
    name: Build (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: vektor
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: vektor
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: vektor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: vektor.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin vektor

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          STAGE="vektor-v${VERSION}-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "target/${TARGET}/release/${BIN}" "dist/${STAGE}/"
          cp README.md LICENSE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "vektor-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BIN" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"

      - name: Upload target archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  package-plugin:
    name: Package Antigravity Plugin
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Archive plugin bundle
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/vektor-plugin-v${VERSION}.tar.gz" plugin README.md LICENSE

      - name: Upload plugin archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plugin
          path: dist/vektor-plugin-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release & SLSA Provenance
    needs: [verify-release, build, package-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum vektor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/vektor-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --title "Vektor ${TAG}" \
            --generate-notes

  publish-crates:
    name: Publish to crates.io
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-crates-io

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not configured; skipping crates.io publish."
            exit 0
          fi
          for crate in vektor-core vektor-analyzers vektor-state vektor-cli; do
            echo "Publishing ${crate}..."
            cargo publish -p "${crate}" --locked
            sleep 15
          done
