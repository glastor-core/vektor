name: Feature Request
description: Propose a new analyzer rule, CLI subcommand, MCP tool, or plugin improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What workflow or pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the desired CLI flags, MCP tool contract, or rule behavior.
    validations:
      required: true
