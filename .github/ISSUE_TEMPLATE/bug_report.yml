name: Bug Report
description: Report a bug or unexpected behavior in Vektor
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. Run `vektor ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`vektor doctor` output"
      description: Paste the output of `vektor doctor` (redact any private paths if needed).
      render: text
