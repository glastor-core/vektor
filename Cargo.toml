[workspace]
resolver = "2"
members = [
    "crates/vektor-core",
    "crates/vektor-analyzers",
    "crates/vektor-state",
    "crates/vektor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/glastor-core/vektor"
homepage = "https://github.com/glastor-core/vektor"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
vektor-analyzers = { version = "0.1.0", path = "crates/vektor-analyzers" }
vektor-core = { version = "0.1.0", path = "crates/vektor-core" }
vektor-state = { version = "0.1.0", path = "crates/vektor-state" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
exit = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
